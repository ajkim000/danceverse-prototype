const svg = document.getElementById('plot');
const legendEl = document.getElementById('legend');
const tip = document.getElementById('tip');
let active = null;
let highlighted = null;
let lockedChoreo = null;
function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function render() {
  svg.innerHTML = `<defs><marker id="axisArrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="#666"></path></marker></defs><line x1="858" y1="650" x2="904" y2="650" stroke="#666" stroke-width="1.5" marker-end="url(#axisArrow)"></line><line x1="858" y1="650" x2="858" y2="604" stroke="#666" stroke-width="1.5" marker-end="url(#axisArrow)"></line><text x="912" y="654" class="axis">${data.projection.toUpperCase()}1</text><text x="852" y="596" class="axis" text-anchor="end">${data.projection.toUpperCase()}2</text>`;
  for (const p of data.points) {
    const c = document.createElementNS('http://www.w3.org/2000/svg','circle');
    c.setAttribute('cx', p.x); c.setAttribute('cy', p.y); c.setAttribute('r', 5.5);
    c.setAttribute('fill', p.color); c.dataset.i = p.i; c.dataset.choreo = p.choreographer;
    c.classList.add('point');
    c.addEventListener('mouseenter', e => showTip(p, e.clientX, e.clientY, false));
    c.addEventListener('mousemove', e => { if (active !== p.i) moveTip(e.clientX, e.clientY); });
    c.addEventListener('mouseleave', () => { if (active !== p.i) tip.style.display='none'; });
    c.addEventListener('click', e => { active = p.i; showTip(p, e.clientX, e.clientY, true); updateClasses(); });
    svg.appendChild(c);
  }
  updateClasses();
}
function renderLegend() {
  legendEl.innerHTML = '<div class="legend-title">Choreographers and Foundations</div>';
  for (const item of data.legend) {
    const row = document.createElement('div'); row.className='legend-row'; row.dataset.choreo=item.label;
    row.innerHTML = `<span class="swatch" style="background:${item.color}"></span><span>${esc(item.label)}</span><span class="count">${item.count}</span>`;
    row.addEventListener('mouseenter', () => { highlighted=item.label; updateClasses(); });
    row.addEventListener('mouseleave', () => { highlighted=null; updateClasses(); });
    row.addEventListener('click', () => {
      lockedChoreo = lockedChoreo === item.label ? null : item.label;
      updateClasses();
    });
    legendEl.appendChild(row);
  }
}
function updateClasses() {
  const current = highlighted || lockedChoreo;
  for (const c of svg.querySelectorAll('.point')) {
    c.classList.toggle('dim', !!(current && c.dataset.choreo !== current));
    c.classList.toggle('active', Number(c.dataset.i) === active);
  }
  for (const row of legendEl.querySelectorAll('.legend-row')) {
    row.classList.toggle('locked', row.dataset.choreo === lockedChoreo);
  }
}
function moveTip(x,y) { tip.style.left = Math.min(window.innerWidth - 390, x + 14) + 'px'; tip.style.top = Math.max(8, y + 14) + 'px'; }
function showTip(p,x,y,pinned) {
  const detail = p.url ? `<div><a href="${esc(p.url)}" target="_blank" rel="noopener">${esc(p.url)}</a></div>` : '<div>No link (personal video)</div>';
  tip.innerHTML = `<div class="vid">${esc(p.title || p.video_id)} · ${esc(p.round)}</div><div>${esc(p.choreographer)}</div>${detail}${pinned ? '<div style="color:#666;margin-top:6px">click another dot to move highlight</div>' : ''}`;
  tip.style.display='block'; moveTip(x,y);
}
svg.addEventListener('click', e => { if (e.target === svg) { active=null; lockedChoreo=null; tip.style.display='none'; updateClasses(); } });
document.addEventListener('keydown', e => { if (e.key === 'Escape') { active=null; lockedChoreo=null; tip.style.display='none'; updateClasses(); } });
renderLegend(); render();
</script>
